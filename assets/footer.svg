<svg xmlns="http://www.w3.org/2000/svg" width="840" height="110" viewBox="0 0 840 110" role="img" aria-label="Gracias por pasar por aquí. Hecho con cariño en México.">
  <defs>
    <clipPath id="frame"><rect width="840" height="110" rx="28"/></clipPath>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1240" height="510"><feGaussianBlur stdDeviation="34"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset="1" stop-color="#1c0c33"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".4" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #fff; }
    .b { animation: drift 14s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .b2 { animation-duration: 17s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 20s; }
    @keyframes drift { 0% { transform: translate(0,0); } 50% { transform: translate(70px,10px); } 100% { transform: translate(-50px,-8px); } }
    .in { opacity: 0; animation: rise 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .heart { transform-box: fill-box; transform-origin: center; animation: beat 1.8s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="840" height="110" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b" cx="140" cy="90" r="90" fill="#4f7cff"/>
      <circle class="b b2" cx="430" cy="10" r="90" fill="#b25cff"/>
      <circle class="b b3" cx="720" cy="100" r="90" fill="#ff6fa8"/>
    </g>
    <rect width="840" height="110" fill="url(#glass)"/>
    <rect x=".75" y=".75" width="838.5" height="108.5" rx="27.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="120" y="1" width="600" height="1.2" fill="url(#spec)"/>

    <text class="t in d1" x="420" y="52" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="-.3">Gracias por pasar por aquí ✦</text>
    <g class="in d2">
      <text class="t" x="406" y="80" font-size="14" text-anchor="end" opacity=".7">Hecho con</text>
      <g transform="translate(412 67) scale(.68)"><path class="heart" d="M12 21s-8.5-5.3-8.5-11.2A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.5 2.6C20.5 15.7 12 21 12 21z" fill="#ff6482"/></g>
      <text class="t" x="434" y="80" font-size="14" opacity=".7">en México</text>
    </g>
  </g>
</svg>
