<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="Proyecto ServiceActivities: evidencia de mis actividades de servicio social, hecho con JavaScript.">
  <defs>
    <clipPath id="frame"><rect width="840" height="170" rx="28"/></clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="iconGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #fff; }
    .b { animation: drift 15s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .b2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 21s; }
    @keyframes drift { 0% { transform: translate(0,0); } 50% { transform: translate(50px,15px); } 100% { transform: translate(-35px,-10px); } }

    .in { opacity: 0; animation: rise 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .app { transform-box: fill-box; transform-origin: center; opacity: 0; animation: app 1s cubic-bezier(.34,1.56,.64,1) .15s forwards; }
    @keyframes app { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

    .sweep { transform: translateX(-300px); animation: sweep 9s cubic-bezier(.45,0,.55,1) 1.2s infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 35%, 100% { transform: translateX(900px); } }

    .arrow { animation: nudge 2.6s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .in, .app { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="840" height="170" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b" cx="120" cy="40" r="95" fill="#ffb020"/>
      <circle class="b b2" cx="520" cy="150" r="110" fill="#6d6bff"/>
      <circle class="b b3" cx="780" cy="30" r="95" fill="#ff5fa2"/>
    </g>

    <rect width="840" height="170" fill="url(#glass)"/>
    <rect class="sweep" x="0" y="0" width="200" height="170" fill="url(#shine)"/>
    <rect x=".75" y=".75" width="838.5" height="168.5" rx="27.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

    <!-- Ícono tipo app de iOS -->
    <g class="app">
      <rect x="40" y="43" width="84" height="84" rx="22" fill="#000" opacity=".35" filter="url(#iconShadow)" transform="translate(0 6)"/>
      <rect x="40" y="43" width="84" height="84" rx="22" fill="url(#icon)"/>
      <rect x="40" y="43" width="84" height="84" rx="22" fill="url(#iconGloss)"/>
      <text class="t" x="82" y="98" font-size="34" font-weight="800" text-anchor="middle" style="fill:#1b1b1f">JS</text>
    </g>

    <text class="t in d1" x="150" y="70" font-size="13" font-weight="600" opacity=".6" letter-spacing="1.2">PROYECTO DESTACADO</text>
    <text class="t in d2" x="149" y="102" font-size="30" font-weight="700" letter-spacing="-.6">ServiceActivities</text>
    <text class="t in d3" x="150" y="130" font-size="16" opacity=".75">Evidencia de mis actividades de servicio social</text>

    <!-- Botón tipo iOS -->
    <g class="in d4">
      <rect x="640" y="66" width="160" height="38" rx="19" fill="#ffffff" fill-opacity=".18" stroke="#ffffff" stroke-opacity=".35"/>
      <text class="t" x="704" y="90.5" font-size="14.5" font-weight="600" text-anchor="middle">Ver repo</text>
      <g class="arrow"><text class="t" x="762" y="91" font-size="16" font-weight="600" text-anchor="middle">→</text></g>
    </g>
  </g>
</svg>
