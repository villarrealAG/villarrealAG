<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-label="Hola, soy Agustín. Programador mexicano enfocado en desarrollo web.">
  <defs>
    <clipPath id="frame"><rect width="840" height="300" rx="32"/></clipPath>
    <clipPath id="card"><rect x="70" y="48" width="700" height="204" rx="30"/></clipPath>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1240" height="700"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="frost" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1240" height="700"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1c0c33"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset=".5" stop-color="#d27bff"/>
      <stop offset="1" stop-color="#ff8fbf"/>
    </linearGradient>
    <radialGradient id="avatar" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </radialGradient>
    <g id="blobs">
      <circle class="b b1" cx="190" cy="80" r="120" fill="#4f7cff"/>
      <circle class="b b2" cx="660" cy="70" r="130" fill="#b25cff"/>
      <circle class="b b3" cx="540" cy="260" r="120" fill="#ff6fa8"/>
      <circle class="b b4" cx="290" cy="270" r="105" fill="#2dd4bf"/>
    </g>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #fff; }
    .b { animation: drift 16s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .b2 { animation-duration: 19s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 14s; }
    .b4 { animation-duration: 21s; animation-direction: alternate-reverse; }
    @keyframes drift {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(60px, 25px); }
      100% { transform: translate(-40px, -20px); }
    }

    .card { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop 1.2s cubic-bezier(.22,1,.36,1) .05s forwards; }
    @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }

    .in { opacity: 0; animation: rise 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .35s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .65s; } .d4 { animation-delay: .8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .sweep { animation: sweep 8s cubic-bezier(.45,0,.55,1) 1.6s infinite; transform: translateX(-320px); }
    @keyframes sweep { 0% { transform: translateX(-320px); } 35%, 100% { transform: translateX(900px); } }

    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }

    .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .float { animation: float 6s cubic-bezier(.45,0,.55,1) infinite alternate; }
    @keyframes float { from { transform: translateY(-4px); } to { transform: translateY(4px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .card, .in { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- Wallpaper -->
    <rect width="840" height="300" fill="url(#bg)"/>
    <use href="#blobs" filter="url(#blur)"/>

    <g class="card">
      <!-- Sombra suave -->
      <rect x="90" y="72" width="660" height="190" rx="30" fill="#000" opacity=".35" filter="url(#shadow)"/>

      <!-- Vidrio: el fondo se ve más difuminado dentro de la tarjeta -->
      <g clip-path="url(#card)">
        <rect width="840" height="300" fill="url(#bg)"/>
        <use href="#blobs" filter="url(#frost)" opacity=".95"/>
        <rect x="70" y="48" width="700" height="204" fill="url(#glass)"/>
        <rect class="sweep" x="0" y="0" width="220" height="300" fill="url(#shine)"/>
      </g>
      <rect x="70.75" y="48.75" width="698.5" height="202.5" rx="29.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <rect x="150" y="48.4" width="540" height="1.3" fill="url(#spec)"/>

      <!-- Pill: estado -->
      <g class="in d1">
        <rect x="108" y="76" width="210" height="30" rx="15" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
        <circle class="pulse" cx="126" cy="91" r="4.5" fill="#34d399"/>
        <circle cx="126" cy="91" r="4.5" fill="#34d399"/>
        <text class="t" x="140" y="96" font-size="13.5" font-weight="500" opacity=".92">Abierto a colaborar</text>
      </g>

      <text class="t in d2" x="106" y="160" font-size="46" font-weight="700" letter-spacing="-1">Hola, soy Agustín</text>
      <text class="t in d3" x="108" y="196" font-size="19" font-weight="400" opacity=".78">Programador mexicano · Desarrollo web</text>
      <text class="t in d4" x="108" y="226" font-size="14" font-weight="500" opacity=".55" letter-spacing=".5">JAVASCRIPT  ·  TYPESCRIPT  ·  REACT  ·  NODE.JS</text>

      <!-- Monograma -->
      <g class="in d3">
        <g class="float">
          <circle class="spin" cx="672" cy="150" r="62" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="120 40 60 30" stroke-linecap="round"/>
          <circle cx="672" cy="150" r="52" fill="url(#avatar)" stroke="#ffffff" stroke-opacity=".45"/>
          <text class="t" x="672" y="166" font-size="44" font-weight="700" text-anchor="middle">A</text>
        </g>
      </g>
    </g>
  </g>
</svg>
