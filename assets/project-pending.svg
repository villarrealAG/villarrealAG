<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="Proyecto destacado: próximamente. Estoy construyendo algo nuevo.">
  <defs>
    <clipPath id="frame"><rect width="840" height="170" rx="28"/></clipPath>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1240" height="570"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset=".5" stop-color="#d27bff"/>
      <stop offset="1" stop-color="#ff8fbf"/>
    </linearGradient>
    <clipPath id="track"><rect x="640" y="114" width="160" height="6" rx="3"/></clipPath>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #fff; }
    .b { animation: drift 15s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .b2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 21s; }
    @keyframes drift { 0% { transform: translate(0,0); } 50% { transform: translate(50px,15px); } 100% { transform: translate(-35px,-10px); } }

    .in { opacity: 0; animation: rise 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; } .d4 { animation-delay: .55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .app { transform-box: fill-box; transform-origin: center; opacity: 0; animation: app 1s cubic-bezier(.34,1.56,.64,1) .15s forwards; }
    @keyframes app { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

    /* Indicador de actividad estilo iOS */
    .spinner { transform-origin: 82px 85px; animation: spin 1s steps(8) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sweep { transform: translateX(-300px); animation: sweep 9s cubic-bezier(.45,0,.55,1) 1.2s infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 35%, 100% { transform: translateX(900px); } }

    .fill { animation: load 3.2s cubic-bezier(.65,0,.35,1) .8s infinite; transform: translateX(-160px); }
    @keyframes load { 0% { transform: translateX(-160px); } 60%, 100% { transform: translateX(170px); } }

    .dot { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .in, .app { opacity: 1; }
      .fill { transform: translateX(-60px); }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="840" height="170" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b" cx="120" cy="40" r="95" fill="#4f7cff"/>
      <circle class="b b2" cx="520" cy="150" r="110" fill="#b25cff"/>
      <circle class="b b3" cx="780" cy="30" r="95" fill="#2dd4bf"/>
    </g>

    <rect width="840" height="170" fill="url(#glass)"/>
    <rect class="sweep" x="0" y="0" width="200" height="170" fill="url(#shine)"/>
    <rect x=".75" y=".75" width="838.5" height="168.5" rx="27.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="120" y="1" width="600" height="1.2" fill="url(#spec)"/>

    <!-- Ícono de app de vidrio con indicador de carga -->
    <g class="app">
      <rect x="40" y="43" width="84" height="84" rx="22" fill="#000" opacity=".3" filter="url(#iconShadow)" transform="translate(0 6)"/>
      <rect x="40" y="43" width="84" height="84" rx="22" fill="url(#icon)" stroke="#ffffff" stroke-opacity=".45"/>
      <g class="spinner" stroke="#fff" stroke-width="4.5" stroke-linecap="round">
        <line x1="82" y1="64" x2="82" y2="74" opacity="1"/>
        <line x1="82" y1="64" x2="82" y2="74" opacity=".85" transform="rotate(-45 82 85)"/>
        <line x1="82" y1="64" x2="82" y2="74" opacity=".7" transform="rotate(-90 82 85)"/>
        <line x1="82" y1="64" x2="82" y2="74" opacity=".55" transform="rotate(-135 82 85)"/>
        <line x1="82" y1="64" x2="82" y2="74" opacity=".42" transform="rotate(-180 82 85)"/>
        <line x1="82" y1="64" x2="82" y2="74" opacity=".32" transform="rotate(-225 82 85)"/>
        <line x1="82" y1="64" x2="82" y2="74" opacity=".24" transform="rotate(-270 82 85)"/>
        <line x1="82" y1="64" x2="82" y2="74" opacity=".18" transform="rotate(-315 82 85)"/>
      </g>
    </g>

    <text class="t in d1" x="150" y="70" font-size="13" font-weight="600" opacity=".6" letter-spacing="1.2">EN CAMINO</text>
    <text class="t in d2" x="149" y="102" font-size="30" font-weight="700" letter-spacing="-.6">Próximamente</text>
    <text class="t in d3" x="150" y="130" font-size="16" opacity=".75">Estoy construyendo algo nuevo. Muy pronto aquí ✦</text>

    <!-- Estado: en desarrollo -->
    <g class="in d4">
      <rect x="640" y="62" width="160" height="38" rx="19" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".35"/>
      <circle class="dot" cx="664" cy="81" r="4.5" fill="#ffcc00"/>
      <text class="t" x="728" y="86.5" font-size="14.5" font-weight="600" text-anchor="middle">En desarrollo</text>
      <rect x="640" y="114" width="160" height="6" rx="3" fill="#ffffff" fill-opacity=".18"/>
      <g clip-path="url(#track)">
        <rect class="fill" x="640" y="114" width="110" height="6" rx="3" fill="url(#bar)"/>
      </g>
    </g>
  </g>
</svg>
